<style>
    .card:hover .title { color: #ff0000; aspect-ratio: 2; }
    .card:active .title { opacity: 0.5; }
    .card:focus .title { color: #0000ff; }
</style>
<x-dc>
    <section style="display:flex; flex-direction:column; gap:12px; width:100vw; height:100vh; padding:16px;">
        <label for="project-name">Project name</label>
        <input
            id="project-name"
            data-htmlswap-state-owner="source"
            value="{{ name }}"
            placeholder="Project name"
            onInput="{{ onName }}"
            style="width:320px; height:32px; padding:6px 10px; border:1px solid #334155; border-radius:6px;"
        >
        <div class="card"><span class="title">Group states</span></div>
        <p style="box-sizing:content-box; max-height:calc(2rem + 8px); min-width:10vmin; font-size:1.25rem; margin:0 0.5rem; box-shadow:0 1px 2px #0004; flex:2 0 auto; aspect-ratio:2;">Units</p>
    </section>
</x-dc>
