[package]
name = "htmlswap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compile HTML, CSS, and component sources into portable render plans and native UI adapters"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/htmlswap"
homepage = "https://github.com/themixednuts/htmlswap"
readme = "README.md"
keywords = ["html", "css", "compiler", "gpui", "svelte"]
categories = ["compilers", "development-tools"]

[dependencies]
arcstr = "1.2.0"
clap = { version = "4.6.1", features = ["derive"] }
compact_str = "0.9.1"
# The version lightningcss uses, for parsing values with its parsers directly.
cssparser = "0.37.0"
heck = "0.5.0"
html5ever = "0.39.0"
include_dir = "0.7.4"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["into_owned"] }
oxc_allocator = "0.137.0"
oxc_ast = "0.137.0"
oxc_ast_visit = "0.137.0"
oxc_parser = "0.137.0"
oxc_span = "0.137.0"
oxc_syntax = "0.137.0"
parcel_selectors = "0.28.2"
rayon = "1.12.0"
rustfmt-wrapper = "0.2.1"
smallvec = "1"
syn = { version = "2.0.118", features = ["full", "parsing"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
ureq = "3.3.0"
url = "2.5.8"
wait-timeout = "0.2.1"

[dev-dependencies]
